<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PGRS KENINGAU - Register Ahli</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: #050a15;
    color: #f1f5f9;
    font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    padding: 15px;
    padding-bottom: 30px;
    min-height: 100vh;
}
.header {
    text-align: center;
    padding: 20px 0;
    border-bottom: 1px solid #1f2d42;
    margin-bottom: 20px;
}
.header h1 {
    color: #fbbf24;
    font-size: 22px;
    letter-spacing: 2px;
    margin-bottom: 5px;
}
.header p { color: #38bdf8; font-size: 12px; letter-spacing: 3px; }
.progress-box {
    background: rgba(56,189,248,0.08);
    border: 1px solid #38bdf8;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
}
.progress-text {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 13px;
}
.progress-text strong { color: #fbbf24; }
.progress-bar {
    height: 15px;
    background: rgba(255,255,255,0.1);
    border-radius: 8px;
    overflow: hidden;
}
.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #22c55e, #4ade80);
    width: 0%;
    transition: width 0.5s;
}
.scan-btn {
    width: 100%;
    padding: 25px 20px;
    font-size: 20px;
    font-weight: 900;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    margin-bottom: 12px;
    letter-spacing: 2px;
    transition: all 0.3s;
}
.scan-btn:active { transform: scale(0.98); }
.scan-btn.borang {
    background: linear-gradient(135deg, #38bdf8, #0284c7);
    color: white;
    box-shadow: 0 0 25px rgba(56,189,248,0.4);
}
.scan-btn.ic {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: white;
    box-shadow: 0 0 25px rgba(34,197,94,0.4);
}
.btn-secondary {
    width: 100%;
    padding: 15px;
    font-size: 14px;
    background: rgba(56,189,248,0.15);
    color: #38bdf8;
    border: 1px solid #38bdf8;
    border-radius: 12px;
    cursor: pointer;
    margin-bottom: 10px;
    font-weight: 700;
    letter-spacing: 1px;
}
.status-box {
    background: rgba(34,197,94,0.1);
    border: 1px solid #22c55e;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
    display: none;
}
.status-box.show { display: block; }
.status-title {
    color: #4ade80;
    font-size: 16px;
    font-weight: 900;
    margin-bottom: 10px;
}
.status-item {
    font-size: 14px;
    line-height: 1.8;
    color: #cbd5e1;
}
.status-item strong { color: #fbbf24; }
.loading {
    text-align: center;
    padding: 30px;
    display: none;
}
.loading.show { display: block; }
.spinner {
    border: 4px solid rgba(255,255,255,0.1);
    border-top: 4px solid #38bdf8;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    animation: spin 1s linear infinite;
    margin: 0 auto 15px;
}
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
input[type="file"] { display: none; }
.modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.modal.show { display: flex; }
.modal-content {
    background: linear-gradient(135deg, #0d1526, #101c33);
    border: 2px solid #fbbf24;
    border-radius: 15px;
    padding: 25px;
    max-width: 400px;
    width: 100%;
}
.modal-title {
    color: #fbbf24;
    font-size: 18px;
    font-weight: 900;
    margin-bottom: 15px;
    text-align: center;
}
.modal-info {
    background: rgba(0,0,0,0.3);
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
    font-size: 13px;
}
.modal-info strong { color: #38bdf8; }
.dun-options {
    display: grid;
    gap: 10px;
    margin-bottom: 15px;
}
.dun-btn {
    padding: 15px;
    background: rgba(56,189,248,0.1);
    border: 1px solid #38bdf8;
    border-radius: 10px;
    color: white;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-align: left;
}
.dun-btn:active { background: rgba(56,189,248,0.3); }
.footer {
    text-align: center;
    padding: 20px;
    color: #64748b;
    font-size: 11px;
    letter-spacing: 2px;
}
</style>
</head>
<body>

<div class="header">
    <h1>📷 PGRS KENINGAU</h1>
    <p>REGISTER AHLI PARTI</p>
</div>

<div class="progress-box">
    <div class="progress-text">
        <span>Progress: <strong id="progress-count">0</strong> / 400</span>
        <span>No. Seterusnya: <strong id="next-no">-</strong></span>
    </div>
    <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
    </div>
</div>

<input type="file" accept="image/*" capture="environment" id="camera-borang" onchange="handleScanBorang(this)">
<button class="scan-btn borang" onclick="document.getElementById('camera-borang').click()">
    📷 SCAN BORANG
</button>

<div class="loading" id="loading">
    <div class="spinner"></div>
    <p id="loading-text">AI tengah baca...</p>
</div>

<div id="ic-section" style="display:none;">
    <input type="file" accept="image/*" capture="environment" id="camera-ic" onchange="handleScanIC(this)">
    <button class="scan-btn ic" onclick="document.getElementById('camera-ic').click()">
        📷 SCAN IC
    </button>
</div>

<div class="status-box" id="status-box">
    <div class="status-title" id="status-title">✅ BORANG SELESAI</div>
    <div class="status-item" id="status-content"></div>
    <button class="scan-btn borang" style="margin-top:15px; padding:15px; font-size:16px;" onclick="nextScan()">
        📷 SCAN SETERUSNYA
    </button>
</div>

<button class="btn-secondary" onclick="downloadExcel()">📥 DOWNLOAD EXCEL</button>
<button class="btn-secondary" onclick="printSenarai()">🖨️ PRINT SENARAI</button>
<button class="btn-secondary" onclick="viewStats()">📊 STATISTIK</button>

<div class="footer">
    PGRS KENINGAU · N39 · N40 · N41
</div>

<div class="modal" id="modal-dun">
    <div class="modal-content">
        <div class="modal-title">⚠️ KAMPUNG BARU DIKESAN</div>
        <div class="modal-info">
            Alamat: <strong id="modal-alamat">-</strong><br>
            Kampung: <strong id="modal-kampung">-</strong>
        </div>
        <p style="margin-bottom:10px; font-size:13px;">Pilih DUN:</p>
        <div class="dun-options">
            <button class="dun-btn" onclick="selectDUN('N41 LIAWAN')">
                📍 N41 LIAWAN
            </button>
            <button class="dun-btn" onclick="selectDUN('N40 BINGKOR')">
                📍 N40 BINGKOR
            </button>
            <button class="dun-btn" onclick="selectDUN('N39 TAMBUNAN')">
                📍 N39 TAMBUNAN
            </button>
        </div>
    </div>
</div>

<script>
let currentBorangData = null;
let currentICData = null;
let learnKeyword = null;

const urlParams = new URLSearchParams(window.location.search);
const APP_PASS = urlParams.get('pass') || 'pgrs-keningau';

async function handleScanBorang(input) {
    const file = input.files[0];
    if (!file) return;
    
    document.getElementById('loading').classList.add('show');
    document.getElementById('loading-text').innerText = 'AI tengah baca borang...';
    document.getElementById('status-box').classList.remove('show');
    document.getElementById('ic-section').style.display = 'none';
    
    const reader = new FileReader();
    reader.onload = async () => {
        const base64 = reader.result.split(',')[1];
        
        try {
            const res = await fetch(`/api/scan-borang?pass=${APP_PASS}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ imageBase64: base64 })
            });
            
            const result = await res.json();
            document.getElementById('loading').classList.remove('show');
            
            if (result.status === 'success') {
                currentBorangData = result.data;
                showStatusBorang(result.data);
                
                if (!result.data.dun_detected) {
                    showModalDUN(result.data.alamat);
                } else {
                    document.getElementById('ic-section').style.display = 'block';
                }
            } else {
                alert('❌ Error: ' + result.message);
            }
        } catch (e) {
            document.getElementById('loading').classList.remove('show');
            alert('❌ Ralat: ' + e.message);
        }
        
        input.value = '';
    };
    reader.readAsDataURL(file);
}

function showStatusBorang(data) {
    const box = document.getElementById('status-box');
    const content = document.getElementById('status-content');
    
    content.innerHTML = `
        ✅ <strong>Borang ${data.no_borang || '?'}</strong><br>
        👤 ${data.nama || '-'}<br>
        📍 ${data.bahagian || '?'} · ${data.cawangan || '?'}<br>
        <br>
        📷 <strong>Sekarang scan IC</strong>
    `;
    
    box.classList.add('show');
}

async function handleScanIC(input) {
    const file = input.files[0];
    if (!file) return;
    
    document.getElementById('loading').classList.add('show');
    document.getElementById('loading-text').innerText = 'AI tengah baca IC...';
    
    const reader = new FileReader();
    reader.onload = async () => {
        const base64 = reader.result.split(',')[1];
        
        try {
            const res = await fetch(`/api/scan-ic?pass=${APP_PASS}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ imageBase64: base64 })
            });
            
            const result = await res.json();
            document.getElementById('loading').classList.remove('show');
            
            if (result.status === 'success') {
                currentICData = result.data;
                const combined = { ...currentBorangData, ...result.data };
                await saveAhli(combined, currentBorangData.dun_detected || null, learnKeyword);
            } else {
                alert('❌ Error: ' + result.message);
            }
        } catch (e) {
            document.getElementById('loading').classList.remove('show');
            alert('❌ Ralat: ' + e.message);
        }
        
        input.value = '';
    };
    reader.readAsDataURL(file);
}

function showModalDUN(alamat) {
    document.getElementById('modal-alamat').innerText = alamat || '-';
    const parts = (alamat || '').split(',');
    const kampung = parts[0] ? parts[0].replace(/kg\.|kampung/gi, '').trim() : '';
    document.getElementById('modal-kampung').innerText = kampung;
    learnKeyword = kampung;
    document.getElementById('modal-dun').classList.add('show');
}

async function selectDUN(dun) {
    document.getElementById('modal-dun').classList.remove('show');
    if (currentBorangData) {
        currentBorangData.dun_detected = dun;
        currentBorangData.auto_learned = true;
        document.getElementById('ic-section').style.display = 'block';
    }
}

async function saveAhli(data, selectedDun, keyword) {
    try {
        const res = await fetch(`/api/save-ahli?pass=${APP_PASS}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                data: data,
                selected_dun: selectedDun,
                learn_keyword: keyword
            })
        });
        
        const result = await res.json();
        
        if (result.status === 'success') {
            const content = document.getElementById('status-content');
            content.innerHTML = `
                ✅ <strong>BORANG ${data.no_borang} SELESAI!</strong><br>
                <br>
                👤 ${data.nama}<br>
                📇 ${data.ic_no}<br>
                📍 DUN: ${data.dun || '-'}<br>
                🏠 Cawangan: ${data.cawangan || '-'}<br>
                👥 ${data.jantina} · ${data.jenis_keahlian}<br>
                📱 ${data.phone || '-'}<br>
                <br>
                💾 <strong>Saved to Google Sheets</strong>
            `;
            
            updateProgress();
            document.getElementById('ic-section').style.display = 'none';
        }
    } catch (e) {
        alert('Save error: ' + e.message);
    }
}

function nextScan() {
    document.getElementById('status-box').classList.remove('show');
    document.getElementById('ic-section').style.display = 'none';
    currentBorangData = null;
    currentICData = null;
    learnKeyword = null;
    document.getElementById('camera-borang').click();
}

let scanCount = parseInt(localStorage.getItem('scanCount') || '0');

function updateProgress() {
    scanCount++;
    localStorage.setItem('scanCount', scanCount);
    const total = 400;
    const percent = (scanCount / total) * 100;
    document.getElementById('progress-count').innerText = scanCount;
    document.getElementById('progress-fill').style.width = percent + '%';
    document.getElementById('next-no').innerText = 355001 + scanCount;
}

function downloadExcel() {
    window.open(`/api/download-excel?pass=${APP_PASS}`, '_blank');
}

function printSenarai() {
    window.open(`/api/print-view?pass=${APP_PASS}`, '_blank');
}

async function viewStats() {
    try {
        const res = await fetch(`/api/ahli-list?pass=${APP_PASS}`);
        const result = await res.json();
        
        if (result.status === 'success') {
            const total = result.total || 0;
            const byDUN = {};
            (result.ahli || []).forEach(a => {
                const dun = a.dun || 'UNKNOWN';
                byDUN[dun] = (byDUN[dun] || 0) + 1;
            });
            
            let statsText = `📊 STATISTIK\n\nTotal: ${total} ahli\n\n`;
            for (const [dun, count] of Object.entries(byDUN)) {
                statsText += `${dun}: ${count}\n`;
            }
            
            alert(statsText);
        }
    } catch (e) {
        alert('Error: ' + e.message);
    }
}

document.getElementById('progress-count').innerText = scanCount;
document.getElementById('progress-fill').style.width = ((scanCount / 400) * 100) + '%';
document.getElementById('next-no').innerText = 355001 + scanCount;
</script>
</body>
</html>
